name: Actualizar tablas Liga 1

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar actualizacion
        run: python scripts/actualizar.py
        continue-on-error: true

      - name: Publicar cambios si los hay
        run: |
          git config user.name "robot-liga1"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data.json ]; then
            git add data.json
            git diff --cached --quiet || git commit -m "Tablas actualizadas $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "data.json aun no existe; nada que publicar."
          fi
